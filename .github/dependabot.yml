version: 2
updates:
  # Base image digest in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Track the 24.04 digest only; moving to a new Ubuntu release changes package names and
      # is done deliberately in a reviewed PR.
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # The Docker-in-Docker sidecar image digest in compose.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  # Actions used by the workflows (pinned by commit SHA).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
